---
containers:
  - name: ANALYSES
    path: ccmvumc_analyses_v1.sif
    source: docker://ccmvumc/analyses
requirements:
  walltime: 0-4
  memory: 8G
inputs:
  xnat:
    subjects:
      sessions: 
        - assessors:
          - types: struct_preproc_v1 
            resources:
              - resource: DATA
                fmatch: mask_ICV_auto.nii.gz
command:
  type: singularity_exec
  container: ANALYSES
  args: /bin/bash /REPO/src/mask_ICV_auto-longit/main.sh
